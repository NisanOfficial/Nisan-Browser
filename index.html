<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Browser</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body, html { height:100%; background:#1a1a1a; }
.topbar {
  height:50px; background:#2d2d2d; display:flex; 
  align-items:center; padding:0 10px; gap:8px;
}
.topbar input {
  flex:1; height:35px; padding:0 12px; 
  background:#1a1a1a; border:none; border-radius:18px;
  color:#fff; outline:none; font-size:14px;
}
.topbar button {
  height:35px; padding:0 15px; background:#404040;
  border:none; border-radius:18px; color:#fff; cursor:pointer;
}
.topbar button:hover { background:#555; }
iframe {
  width:100%; height:calc(100% - 50px); border:none;
}
</style>
</head>
<body>

<div class="topbar">
  <button onclick="goBack()">←</button>
  <button onclick="goForward()">→</button>
  <button onclick="reload()">⟳</button>
  <input type="text" id="url" placeholder="Enter URL like google.com" value="google.com">
  <button onclick="go()">Go</button>
</div>

<iframe id="frame" src="https://www.google.com"></iframe>

<script>
const frame = document.getElementById('frame');
const urlInput = document.getElementById('url');

function go(){
  let url = urlInput.value.trim();
  
  if(!url) return;
  
  // http na thakle add koro
  if(!url.startsWith('http')){
    url = 'https://' + url;
  }
  
  frame.src = url;
  urlInput.value = url.replace('https://', '').replace('http://', '');
}

function goBack(){
  history.back();
}

function goForward(){
  history.forward();
}

function reload(){
  frame.src = frame.src;
}

// Enter press korle search hobe
urlInput.addEventListener('keypress', e => {
  if(e.key === 'Enter') go();
});
</script>

</body>
</html>
