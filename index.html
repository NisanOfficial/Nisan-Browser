<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N1SA9 Browser</title>
<style>
* { margin:0; padding:0; }
body, html { height: 100%; overflow: hidden; background:#000; }
.topbar {
  height: 45px;
  background: #202020;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
}
.topbar input {
  flex: 1;
  padding: 8px 12px;
  border: none;
  border-radius: 20px;
  background: #121212;
  color: #fff;
  font-size: 14px;
  outline: none;
}
.topbar button {
  padding: 8px 12px;
  background: #303030;
  border: none;
  border-radius: 20px;
  color: #fff;
  cursor: pointer;
}
iframe {
  width: 100%;
  height: calc(100% - 45px);
  border: none;
}
</style>
</head>
<body>

<div class="topbar">
  <button onclick="goBack()">←</button>
  <button onclick="goForward()">→</button>
  <button onclick="reload()">⟳</button>
  <input type="text" id="url" value="https://m.youtube.com/?persist_app=1&app=desktop">
  <button onclick="go()">Go</button>
</div>

<iframe id="frame" src="https://m.youtube.com/?persist_app=1&app=desktop" 
  allow="autoplay; fullscreen">
</iframe>

<script>
const frame = document.getElementById('frame');
const urlInput = document.getElementById('url');

function go(){
  let url = urlInput.value;
  if(!url.startsWith('http')) url = 'https://' + url;
  
  // Force desktop mode
  if(url.includes('youtube.com') && !url.includes('app=desktop')){
    url += url.includes('?') ? '&app=desktop' : '?app=desktop';
  }
  
  frame.src = url;
}

function goBack(){ frame.contentWindow.history.back(); }
function goForward(){ frame.contentWindow.history.forward(); }
function reload(){ frame.src = frame.src; }

// Enter press korle go
urlInput.addEventListener('keypress', e => {
  if(e.key === 'Enter') go();
});
</script>

</body>
</html>
